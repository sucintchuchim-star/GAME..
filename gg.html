<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Script Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            padding-bottom: 15px;
            border-bottom: 1px solid #1e293b;
        }

        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
        }

        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-danger {
            background-color: #ef4444;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-success {
            background-color: #22c55e;
        }
        .btn-success:hover {
            background-color: #16a34a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Script Grid */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .script-card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #334155;
        }

        .script-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .script-game {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .script-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
        }

        .empty-text {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 1.1rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 4px;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
            font-family: monospace;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* Admin Controls */
        .admin-panel {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px dashed #38bdf8;
        }
    </style>
</head>
<body>

    <header>
        <h1>ROBLOX SCRIPT HUB</h1>
        <div>
            <button id="adminBtn" class="btn" onclick="openLoginModal()">เข้าสู่ระบบแอดมิน</button>
            <button id="logoutBtn" class="btn btn-danger" onclick="logoutAdmin()" style="display: none;">ออกจากระบบ</button>
        </div>
    </header>

    <div class="container">
        <!-- แถบเครื่องมือแอดมิน (จะแสดงเมื่อล็อกอิน) -->
        <div id="adminPanel" class="admin-panel" style="display: none;">
            <span>สถานะ: <strong>แอดมิน</strong></span>
            <button class="btn btn-success" onclick="openAddModal()">+ เพิ่มสคริปต์ใหม่</button>
        </div>

        <!-- รายการสคริปต์ -->
        <div id="scriptGrid" class="script-grid"></div>
        <div id="emptyText" class="empty-text" style="display: none;">ยังไม่มีสคริปต์ในขณะนี้</div>
    </div>

    <!-- Modal เข้าสู่ระบบแอดมิน -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">ยืนยันตัวตนแอดมิน</div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="adminPassword" placeholder="กรอกรหัสผ่าน">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('loginModal')">ยกเลิก</button>
                <button class="btn btn-success" onclick="checkPassword()">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- Modal เพิ่มสคริปต์ -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">เพิ่มสคริปต์ใหม่</div>
            <div class="form-group">
                <label>ชื่อสคริปต์</label>
                <input type="text" id="scriptTitle" placeholder="เช่น Blox Fruits Auto Farm">
            </div>
            <div class="form-group">
                <label>ชื่อเกม</label>
                <input type="text" id="scriptGame" placeholder="เช่น Blox Fruits">
            </div>
            <div class="form-group">
                <label>โค้ดสคริปต์ (Code)</label>
                <textarea id="scriptCode" placeholder="loadstring(game:HttpGet(...))()"></textarea>
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('addModal')">ยกเลิก</button>
                <button class="btn btn-success" onclick="saveScript()">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "nn2";
        let isAdmin = false;
        let scripts = JSON.parse(localStorage.getItem('roblox_scripts')) || [];

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        renderScripts();

        function renderScripts() {
            const grid = document.getElementById('scriptGrid');
            const emptyText = document.getElementById('emptyText');
            grid.innerHTML = '';

            if (scripts.length === 0) {
                emptyText.style.display = 'block';
            } else {
                emptyText.style.display = 'none';
                scripts.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'script-card';
                    card.innerHTML = `
                        <div class="script-title">${escapeHtml(item.title)}</div>
                        <div class="script-game">เกม: ${escapeHtml(item.game)}</div>
                        <div class="script-actions">
                            <button class="btn btn-success" style="flex:1;" onclick="copyScript(${index})">คัดลอกสคริปต์</button>
                            ${isAdmin ? `<button class="btn btn-danger" onclick="deleteScript(${index})">ลบ</button>` : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        // ระบบคัดลอกสคริปต์
        function copyScript(index) {
            const code = scripts[index].code;
            navigator.clipboard.writeText(code).then(() => {
                alert('คัดลอกสคริปต์เรียบร้อยแล้ว!');
            }).catch(err => {
                alert('ไม่สามารถคัดลอกได้');
            });
        }

        // ระบบแอดมิน
        function openLoginModal() {
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginModal').classList.add('active');
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                closeModal('loginModal');
                updateAdminUI();
            } else {
                alert('รหัสผ่านไม่ถูกต้อง');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            updateAdminUI();
        }

        function updateAdminUI() {
            document.getElementById('adminBtn').style.display = isAdmin ? 'none' : 'inline-block';
            document.getElementById('logoutBtn').style.display = isAdmin ? 'inline-block' : 'none';
            document.getElementById('adminPanel').style.display = isAdmin ? 'flex' : 'none';
            renderScripts();
        }

        // เพิ่มและลบสคริปต์
        function openAddModal() {
            document.getElementById('scriptTitle').value = '';
            document.getElementById('scriptGame').value = '';
            document.getElementById('scriptCode').value = '';
            document.getElementById('addModal').classList.add('active');
        }

        function saveScript() {
            const title = document.getElementById('scriptTitle').value.trim();
            const game = document.getElementById('scriptGame').value.trim();
            const code = document.getElementById('scriptCode').value.trim();

            if (!title || !game || !code) {
                alert('กรุณากรอกข้อมูลให้ครบทุกช่อง');
                return;
            }

            scripts.push({ title, game, code });
            localStorage.setItem('roblox_scripts', JSON.stringify(scripts));
            closeModal('addModal');
            renderScripts();
        }

        function deleteScript(index) {
            if (confirm('คุณต้องการลบสคริปต์นี้ใช่หรือไม่?')) {
                scripts.splice(index, 1);
                localStorage.setItem('roblox_scripts', JSON.stringify(scripts));
                renderScripts();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
